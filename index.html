<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toko AQSHA - Instant Store</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']}}}};</script>
<style>
body{background:#f4f3fb}
.card{background:#fff;border-radius:1.25rem;box-shadow:0 1px 2px rgba(79,70,229,.06),0 10px 30px rgba(79,70,229,.07)}
.inp{width:100%;border:1px solid #e5e7eb;border-radius:.75rem;padding:.7rem .9rem;font-size:.9rem;background:#fff;outline:none}
.inp:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.btn{background:#4f46e5;color:#fff;font-weight:600;border-radius:.75rem;padding:.7rem 1.1rem;font-size:.9rem;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn:hover{background:#4338ca}.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-ghost{background:#eef2ff;color:#4f46e5}.btn-ghost:hover{background:#e0e7ff}
.btn-danger{background:#fef2f2;color:#dc2626}.btn-danger:hover{background:#fee2e2}
.spin{width:1rem;height:1rem;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.spin.dark{border-color:#c7d2fe;border-top-color:#4f46e5}
@keyframes sp{to{transform:rotate(360deg)}}
.nav a{display:flex;align-items:center;gap:.75rem;padding:.65rem .9rem;border-radius:.8rem;font-weight:600;font-size:.9rem;color:#e0e7ff;cursor:pointer}
.nav a.on,.nav a:hover{background:rgba(255,255,255,.16);color:#fff}
.sec{font-size:.7rem;font-weight:700;color:#94a3b8;margin:1rem 0 .4rem}
:focus-visible{outline:2px solid #6366f1;outline-offset:2px}
#print-root{display:none}
@media print{@page{size:A4;margin:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}body>*:not(#print-root){display:none!important}#print-root{display:block!important}}
</style>
</head>
<body class="font-sans text-slate-800 antialiased">
<div id="app"></div>
<div id="modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-900/50 p-0 sm:p-4"></div>
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2.5 rounded-xl text-sm font-semibold text-white shadow-lg"></div>
<script>
/* ============ KONFIGURASI ============ */
const SUPABASE_URL='https://obvrduoscrdklfofxgkk.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_g6s3vnbsS3HD0TO8sOYXlA_qS_W6Vm-';
/* ====================================== */
if(!/^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL)||SUPABASE_ANON_KEY.startsWith('ISI_')){
  document.body.innerHTML='<div style="padding:2rem;font-family:sans-serif;max-width:32rem;margin:auto"><h2>Konfigurasi belum diisi</h2><p>Isi SUPABASE_URL dan SUPABASE_ANON_KEY di index.html, lalu muat ulang.</p></div>';
  throw new Error('Supabase belum dikonfigurasi');
}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app'),modal=$('#modal');
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const waNum=n=>{let d=String(n||'').replace(/\D/g,'');return d.startsWith('0')?'62'+d.slice(1):d};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const baseUrl=()=>location.origin+location.pathname;
const copy=t=>navigator.clipboard.writeText(t).then(()=>toast('Disalin'),()=>toast('Gagal menyalin',false));
let session=null,dashTab='home',invEdit=null;

function toast(m,ok=true){const t=$('#toast');t.textContent=m;t.className='fixed top-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-sm font-semibold text-white shadow-lg '+(ok?'bg-emerald-600':'bg-red-600');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),3800)}
async function withLoading(btn,fn){const o=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> Memproses...';try{await fn()}catch(e){console.error(e);toast(e.message||'Terjadi kesalahan. Coba lagi.',false)}finally{btn.disabled=false;btn.innerHTML=o}}
const loadingView=()=>app.innerHTML='<div class="min-h-screen grid place-items-center"><span class="spin dark" style="width:2rem;height:2rem"></span></div>';
const openModal=h=>{modal.innerHTML=`<div class="card w-full sm:max-w-md max-h-[92vh] overflow-y-auto p-5 rounded-b-none sm:rounded-b-[1.25rem]">${h}</div>`;modal.classList.remove('hidden');modal.classList.add('flex')};
const closeModal=()=>{modal.classList.add('hidden');modal.classList.remove('flex');modal.innerHTML=''};
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

/* ---- Upload gambar ke Supabase Storage ---- */
async function upload(file,folder){
  if(!file.type.startsWith('image/'))throw new Error('File harus berupa gambar.');
  if(file.size>3*1024*1024)throw new Error('Ukuran gambar maksimal 3 MB.');
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=`${session.user.id}/${folder}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from('media').upload(path,file,{contentType:file.type});
  if(error)throw new Error('Upload gagal: '+error.message+' (sudah menjalankan schema_v2.sql?)');
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
const picked=(form,name)=>form.elements[name]?.files?.[0];
const fileField=(name,label,url)=>`<div><p class="text-xs font-semibold text-slate-500 mb-1">${label}</p><div class="flex items-center gap-3"><img data-prev="${name}" src="${esc(url||'')}" class="w-14 h-14 rounded-xl object-cover bg-indigo-50 ${url?'':'invisible'}" alt=""><input type="file" name="${name}" accept="image/*" class="text-xs flex-1 min-w-0"></div></div>`;
document.addEventListener('change',e=>{const i=e.target;if(i.type==='file'&&i.files[0]){const im=$(`[data-prev="${i.name}"]`);if(im){im.src=URL.createObjectURL(i.files[0]);im.classList.remove('invisible')}}});

/* ============ ROUTER ============ */
async function route(){
  const h=location.hash.replace(/^#\/?/,'');
  if(h.startsWith('store/')){const [p,q]=h.split('?');const sp=new URLSearchParams(q||'');return viewStore(decodeURIComponent(p.split('/')[1]||''),sp.get('ref'),sp.get('p'))}
  const {data}=await sb.auth.getSession();session=data.session;
  return session?viewDash():viewAuth();
}
addEventListener('hashchange',route);
sb.auth.onAuthStateChange((_e,s)=>{session=s});
route();

/* ============ AUTH ============ */
function viewAuth(mode='login'){
  const reg=mode==='register';
  app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4" style="background:radial-gradient(900px 400px at 50% -10%,#e0e7ff,transparent)">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6"><div class="mx-auto w-12 h-12 rounded-2xl grid place-items-center text-white text-xl font-extrabold" style="background:linear-gradient(135deg,#6366f1,#7c3aed)">T</div>
    <h1 class="mt-4 text-2xl font-extrabold">${reg?'Buka toko Anda':'Masuk ke dashboard'}</h1>
    <p class="text-sm text-slate-500 mt-1">${reg?'Satu link untuk semua produk Anda.':'Kelola produk, pesanan, dan afiliasi.'}</p></div>
    <form id="af" class="card p-5 space-y-3">
      ${reg?`<input class="inp" name="store_name" placeholder="Nama toko" required>
      <input class="inp" name="username" placeholder="Username (huruf kecil, tanpa spasi)" pattern="[a-z0-9_]{3,20}" title="3-20 karakter: huruf kecil, angka, underscore" required>
      <input class="inp" name="wa" placeholder="Nomor WhatsApp, mis. 0812xxxx" inputmode="tel" required>`:''}
      <input class="inp" type="email" name="email" placeholder="Email" required>
      <input class="inp" type="password" name="password" placeholder="Password (min. 6 karakter)" minlength="6" required>
      <button class="btn w-full" type="submit">${reg?'Daftar':'Masuk'}</button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-4">${reg?'Sudah punya akun?':'Belum punya akun?'} <button id="sw" class="text-indigo-600 font-semibold">${reg?'Masuk':'Daftar'}</button></p>
  </div></div>`;
  $('#sw').onclick=()=>viewAuth(reg?'login':'register');
  $('#af').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    withLoading($('#af button[type=submit]'),async()=>{
      if(reg){
        const {data,error}=await sb.auth.signUp({email:f.email,password:f.password,options:{data:{username:f.username.toLowerCase(),store_name:f.store_name,whatsapp_number:waNum(f.wa)}}});
        if(error)throw new Error(error.message);
        if(!data.session){toast('Pendaftaran berhasil. Cek email untuk konfirmasi, lalu masuk.');return viewAuth('login')}
      }else{
        const {error}=await sb.auth.signInWithPassword({email:f.email,password:f.password});
        if(error){const m=error.message||'';
          if(/not confirmed/i.test(m))throw new Error('Email belum dikonfirmasi. Cek inbox/spam, atau matikan "Confirm email" di Supabase.');
          if(/invalid login/i.test(m))throw new Error('Email atau password salah (atau akun belum terdaftar).');
          if(/failed to fetch|network/i.test(m))throw new Error('Tidak bisa terhubung ke Supabase. Periksa SUPABASE_URL.');
          throw new Error(m)}
      }
      route();
    })}
}

/* ============ DASHBOARD ============ */
const NAV=[['home','🏠','Beranda'],['products','📦','Produk'],['orders','🧾','Pesanan'],['affiliate','🤝','Afiliasi'],['invoice','📄','Invoice'],['settings','⚙️','Setelan']];
const stCls=s=>s==='Lunas'?'bg-emerald-50 text-emerald-700':s==='Dibatalkan'?'bg-slate-100 text-slate-500':'bg-amber-50 text-amber-700';

async function viewDash(){
  loadingView();
  const uid=session.user.id;
  const [p,pr,o,af,st,iv,ev,dr]=await Promise.all([
    sb.from('profiles').select('*').eq('id',uid).single(),
    sb.from('products').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    sb.from('orders').select('*, products(title, price)').order('created_at',{ascending:false}),
    sb.from('affiliates').select('id,code,created_at,profiles!affiliates_user_id_fkey(username,store_name)').eq('seller_id',uid),
    sb.rpc('affiliate_stats'),
    sb.from('invoices').select('*').order('created_at',{ascending:false}),
    sb.from('store_events').select('type,created_at').gte('created_at',new Date(Date.now()-30*864e5).toISOString()).order('created_at',{ascending:false}).limit(5000),
    sb.from('profiles').select('id,username,store_name,avatar_url,affiliate_rate,affiliate_note,products(id,title,category,price,affiliate_enabled,affiliate_rate)').eq('affiliate_enabled',true)
  ]);
  const err=p.error||pr.error||o.error||af.error||st.error||iv.error||ev.error||dr.error;
  if(err){app.innerHTML=`<div class="min-h-screen grid place-items-center p-6 text-center"><div class="max-w-sm"><p class="font-bold">Gagal memuat data</p><p class="text-sm text-slate-500 mt-1">${esc(err.message)}</p><p class="text-xs text-slate-400 mt-2">Pastikan schema.sql, schema_v2.sql, dan schema_v3.sql sudah dijalankan.</p><button class="btn mt-4" onclick="viewDash()">Coba lagi</button> <button class="btn btn-danger mt-4" id="lo0">Keluar</button></div></div>`;$('#lo0').onclick=async()=>{await sb.auth.signOut();viewAuth()};return}
  const P=p.data,prods=pr.data,orders=o.data,mine=af.data,myAff=st.data||[];const invoices=iv.data,dir=dr.data||[];EV=ev.data||[];
  const pm=P.payment_methods||{};const CTX={P,prods,orders,mine,myAff,invoices,dir,uid,pm};
  const paid=orders.filter(x=>x.status==='Lunas'),pending=orders.filter(x=>x.status==='Menunggu Pembayaran');
  const revenue=paid.reduce((s,x)=>s+Number(x.products?.price||0)-Number(x.commission||0),0);
  const link=`${baseUrl()}#/store/${P.username}`;
  const avatar=P.avatar_url?`<img src="${esc(safeUrl(P.avatar_url))}" class="w-full h-full object-cover" alt="">`:esc((P.store_name||'T')[0]);

  /* grafik 7 hari */
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
  const cnt=days.map(d=>orders.filter(x=>new Date(x.created_at).toDateString()===d.toDateString()).length),mx=Math.max(1,...cnt);

  const orderRow=x=>`<div class="card p-4 mb-3"><div class="flex justify-between gap-2"><p class="font-semibold">${esc(x.products?.title||'-')}</p><span class="text-xs font-semibold px-2 py-1 rounded-full h-fit ${stCls(x.status)}">${esc(x.status)}</span></div>
    <p class="text-sm text-slate-600 mt-1">${esc(x.buyer_name)} · ${esc(x.buyer_whatsapp)}</p>
    <p class="text-xs text-slate-400">${esc(x.buyer_email)} · ${new Date(x.created_at).toLocaleString('id-ID')}</p>
    <p class="text-xs text-slate-500 mt-1">Pembayaran: <b>${esc(x.payment_method||'-')}</b>${x.affiliate_code?` · Afiliasi <b>${esc(x.affiliate_code)}</b> (komisi ${rp(x.commission)})`:''}</p>
    <div class="flex items-center justify-between gap-2 mt-3"><p class="font-bold text-indigo-600">${rp(x.products?.price)}</p><div class="flex gap-1.5 flex-wrap justify-end">
      <a class="btn btn-ghost !py-1 !px-3 text-xs" target="_blank" rel="noopener" href="https://wa.me/${waNum(x.buyer_whatsapp)}">Chat</a>
      <button class="btn btn-ghost !py-1 !px-3 text-xs" data-oedit="${x.id}">Ubah</button><button class="btn btn-ghost !py-1 !px-3 text-xs" data-oinv="${x.id}">Invoice</button><button class="btn btn-danger !py-1 !px-3 text-xs" data-odel="${x.id}">Hapus</button>
      ${x.status!=='Lunas'?`<button class="btn !py-1 !px-3 text-xs" data-st="${x.id}|Lunas">Tandai lunas</button>`:''}
      ${x.status==='Menunggu Pembayaran'?`<button class="btn btn-danger !py-1 !px-3 text-xs" data-st="${x.id}|Dibatalkan">Batalkan</button>`:''}</div></div></div>`;

  let body='';
  if(dashTab==='home')body=`
    <div class="rounded-3xl p-5 text-white relative overflow-hidden" style="background:linear-gradient(135deg,#4f46e5,#7c3aed)">
      <div class="absolute -right-8 -top-8 w-40 h-40 rounded-full bg-white/10"></div><div class="absolute right-10 -bottom-10 w-28 h-28 rounded-full bg-white/10"></div>
      <p class="text-sm text-indigo-100 relative">Pendapatan bersih (pesanan lunas)</p>
      <p class="text-3xl font-extrabold mt-1 relative">${rp(revenue)}</p>
      <div class="mt-4 flex items-center gap-2 bg-white/15 rounded-xl p-2 text-xs relative"><span class="truncate flex-1">${esc(link)}</span><button id="cp" class="bg-white text-indigo-700 font-semibold rounded-lg px-3 py-1.5">Salin</button></div>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-3">
      ${[['Produk',prods.length],['Pesanan',orders.length],['Menunggu bayar',pending.length]].map(([l,v])=>`<div class="card p-4"><p class="text-[11px] text-slate-500">${l}</p><p class="text-2xl font-extrabold mt-1">${v}</p></div>`).join('')}
    </div>
    <div id="vc"></div><div class="card p-4 mt-3"><p class="font-bold text-sm mb-3">Pesanan 7 hari terakhir</p>
      <div class="flex items-end gap-2 h-28">${cnt.map((c,i)=>`<div class="flex-1 text-center"><div class="rounded-lg mx-auto w-full" style="height:${Math.max(6,c/mx*88)}px;background:${c?'linear-gradient(#818cf8,#6366f1)':'#e5e7eb'}"></div><p class="text-[10px] text-slate-400 mt-1">${days[i].getDate()}</p></div>`).join('')}</div></div>
    <div class="flex items-center justify-between mt-5 mb-2"><p class="font-bold">Pesanan terbaru</p><button class="text-sm text-indigo-600 font-semibold" data-tab="orders">Lihat semua</button></div>
    ${orders.slice(0,3).map(orderRow).join('')||'<div class="card p-6 text-center text-sm text-slate-500">Belum ada pesanan. Bagikan link toko Anda untuk mulai menerima pesanan.</div>'}`;
  if(dashTab==='products')body=`
    <div class="flex items-center justify-between mb-3"><h2 class="font-extrabold text-xl">Produk</h2><button id="addp" class="btn">+ Tambah</button></div>
    ${prods.length?prods.map(x=>`<div class="card p-3 mb-3 flex gap-3">
      <img src="${esc(safeUrl(x.image_url))}" onerror="this.style.visibility='hidden'" class="w-16 h-16 rounded-xl object-cover bg-indigo-50 shrink-0" alt="">
      <div class="flex-1 min-w-0"><p class="font-semibold truncate">${esc(x.title)}</p><p class="text-xs text-slate-500">${esc(x.category)}</p><p class="text-indigo-600 font-bold text-sm mt-0.5">${rp(x.price)}</p></div>
      <div class="flex flex-col gap-1.5"><button class="btn btn-ghost !py-1 !px-3 text-xs" data-edit="${x.id}">Ubah</button><button class="btn btn-danger !py-1 !px-3 text-xs" data-del="${x.id}">Hapus</button></div></div>`).join(''):'<div class="card p-8 text-center text-slate-500 text-sm">Belum ada produk. Tambahkan produk pertama Anda.</div>'}`;
  if(dashTab==='orders')body=`<h2 class="font-extrabold text-xl mb-3">Pesanan</h2>${orders.map(orderRow).join('')||'<div class="card p-8 text-center text-slate-500 text-sm">Belum ada pesanan.</div>'}`;
  if(dashTab==='affiliate')body=affiliateBody(CTX);
  if(dashTab==='invoice')body=invoiceBody(CTX);
  if(dashTab==='settings')body=`<h2 class="font-extrabold text-xl mb-3">Pengaturan</h2>
    <form id="pf" class="card p-5 space-y-3">
      ${fileField('banner','Banner toko',P.banner_url)}${fileField('avatar','Foto profil',P.avatar_url)}
      <input class="inp" name="store_name" value="${esc(P.store_name)}" placeholder="Nama toko" required>
      <textarea class="inp" name="bio" rows="3" placeholder="Bio singkat">${esc(P.bio)}</textarea>
      <input class="inp" name="wa" value="${esc(P.whatsapp_number)}" placeholder="Nomor WhatsApp" inputmode="tel" required>
      <p class="sec !mb-0">METODE PEMBAYARAN</p>
      ${fileField('qris','Gambar QRIS',pm.qris)}
      <div><p class="text-xs text-slate-500 mb-1">Transfer bank (satu per baris: Bank|No. Rekening|Atas Nama)</p><textarea class="inp" name="banks" rows="3" placeholder="BCA|1234567890|Budi Santoso">${esc((pm.banks||[]).map(b=>[b.bank,b.no,b.name].join('|')).join('\n'))}</textarea></div>
      <div><p class="text-xs text-slate-500 mb-1">E-Wallet (satu per baris: Nama|Nomor)</p><textarea class="inp" name="ews" rows="3" placeholder="DANA|081234567890">${esc((pm.ewallets||[]).map(w=>[w.name,w.no].join('|')).join('\n'))}</textarea></div>
      <input class="inp" name="other" value="${esc(pm.other)}" placeholder="Metode lain (mis. Bayar di tempat / PayPal)">
      <p class="text-xs text-slate-400">Username: @${esc(P.username)}</p>
      <button class="btn w-full" type="submit">Simpan pengaturan</button>
    </form>
    <button id="lo" class="btn btn-danger w-full mt-3">Keluar</button>`;

  app.innerHTML=`
  <aside class="hidden md:flex fixed inset-y-0 left-0 w-60 flex-col p-4 text-white" style="background:linear-gradient(180deg,#4338ca,#6d28d9)">
    <div class="flex items-center gap-3 px-2 py-3"><div class="w-10 h-10 rounded-xl bg-white/20 grid place-items-center font-extrabold">T</div><p class="font-extrabold text-lg">Toko AQSHA</p></div>
    <nav class="nav mt-4 space-y-1">${NAV.map(([k,i,l])=>`<a data-tab="${k}" class="${dashTab===k?'on':''}"><span>${i}</span>${l}</a>`).join('')}</nav>
    <a href="#/store/${esc(P.username)}" class="mt-auto btn !bg-white !text-indigo-700">Lihat toko publik</a>
  </aside>
  <div class="md:pl-60"><main class="${dashTab==='invoice'&&invEdit?'max-w-6xl':'max-w-2xl'} mx-auto px-4 pt-5 pb-28 md:pb-10">
    <header class="flex items-center gap-3 mb-5"><div class="w-11 h-11 rounded-full bg-indigo-100 overflow-hidden grid place-items-center font-bold text-indigo-600">${avatar}</div>
    <div class="flex-1"><p class="text-xs text-slate-500">Halo,</p><p class="font-extrabold leading-tight">${esc(P.store_name)}</p></div>
    <a href="#/store/${esc(P.username)}" class="md:hidden text-xs font-semibold text-indigo-600 bg-indigo-50 px-3 py-2 rounded-xl">Toko saya</a></header>
    ${body}</main></div>
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-100 grid grid-cols-6">
    ${NAV.map(([k,i,l])=>`<a data-tab="${k}" class="py-2.5 text-center text-[10px] font-semibold cursor-pointer ${dashTab===k?'text-indigo-600':'text-slate-400'}"><span class="block text-lg leading-none">${i}</span>${l}</a>`).join('')}</nav>`;

  $$('[data-tab]').forEach(a=>a.onclick=()=>{dashTab=a.dataset.tab;if(dashTab!=='invoice')invEdit=null;viewDash()});
  $$('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  if($('#cp'))$('#cp').onclick=()=>copy(link);

let EV=[],evRange=14;
async function track(sid,type,pid=null){try{
  if(type==='view'){const k='v_'+sid;if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}
  const {data}=await sb.auth.getSession();if(data.session?.user?.id===sid)return;

}catch(e){}}

function drawChart(){const box=$('#vc');if(!box)return;
  const days=[...Array(evRange)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(evRange-1)+i);return d});
  const n=(t,d)=>EV.filter(e=>e.type===t&&new Date(e.created_at).toDateString()===d.toDateString()).length;
  const v=days.map(d=>n('view',d)),c=days.map(d=>n('click',d)),mx=Math.max(1,...v,...c),sum=a=>a.reduce((s,x)=>s+x,0),step=Math.ceil(evRange/7);
  box.innerHTML=`<div class="card p-4 mt-3"><div class="flex items-center justify-between"><p class="font-bold text-sm">Total Views &amp; Clicks</p>
  <select id="evr" class="text-xs border border-slate-200 rounded-lg px-2 py-1.5 bg-white">${[7,14,30].map(r=>`<option value="${r}" ${r===evRange?'selected':''}>${r} hari</option>`).join('')}</select></div>
  <div class="flex gap-6 mt-3"><div><p class="text-xs text-slate-500"><span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 mr-1"></span>Views</p><p class="text-2xl font-extrabold">${sum(v)}</p></div>
  <div><p class="text-xs text-slate-500"><span class="inline-block w-2.5 h-2.5 rounded-full bg-indigo-500 mr-1"></span>Clicks</p><p class="text-2xl font-extrabold">${sum(c)}</p></div></div>
  <div class="relative mt-4"><p class="absolute -top-1 left-0 text-[10px] text-slate-400">${mx}</p>
  <div class="flex items-end gap-1 h-40 border-b border-slate-200 pl-4">${days.map((d,i)=>`<div class="flex-1 h-full flex items-end justify-center gap-[2px]" title="${d.getDate()}/${d.getMonth()+1}: ${v[i]} views, ${c[i]} clicks"><div class="w-full max-w-[10px] rounded-t bg-amber-400" style="height:${v[i]/mx*100}%;min-height:${v[i]?3:0}px"></div><div class="w-full max-w-[10px] rounded-t bg-indigo-500" style="height:${c[i]/mx*100}%;min-height:${c[i]?3:0}px"></div></div>`).join('')}</div>
  <div class="flex gap-1 mt-1 pl-4">${days.map((d,i)=>`<p class="flex-1 text-center text-[9px] text-slate-400">${i%step===0?d.getDate()+'/'+(d.getMonth()+1):''}</p>`).join('')}</div></div>
  <p class="text-[11px] text-slate-400 mt-2">Views = kunjungan toko (1x per sesi pengunjung). Clicks = klik tombol "Beli sekarang".</p></div>`;
  $('#evr').onchange=e=>{evRange=+e.target.value;drawChart()};
}

/* ---- Invoice ---- */
const fmtD=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}):'';
function invCalc(d){const sub=d.items.reduce((s,i)=>s+(+i.q||0)*(+i.p||0),0),disc=+d.discount||0,tax=Math.max(0,sub-disc)*(+d.tax||0)/100;return{sub,disc,tax,total:sub-disc+tax}}

function newInvoice(C,order){
  const P=C.P,pm=P.payment_methods||{},b=(pm.banks||[])[0]||{},today=new Date().toISOString().slice(0,10),due=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  return {id:null,data:{no:'INV-'+today.replace(/-/g,'')+'-'+String(C.invoices.length+1).padStart(3,'0'),date:today,due,status:'Belum Dibayar',color:'#0f6b7a',
    brand:{name:P.store_name||'',tag:'',logo:P.avatar_url||'',phone:P.whatsapp_number||'',email:'',web:`${baseUrl()}#/store/${P.username}`,addr:''},
    bill:{name:order?.buyer_name||'',company:'',phone:order?.buyer_whatsapp||'',addr:order?.buyer_email||''},
    items:order?[{d:order.products?.title||'',q:1,p:order.products?.price||0}]:[{d:'',q:1,p:0}],tax:0,discount:0,
    pay:{info:b.bank?`Bank: ${b.bank}\nNo. Rekening: ${b.no}\nAtas nama: ${b.name||''}`:''},terms:'Pembayaran paling lambat pada tanggal jatuh tempo.',
    sign:{img:'',stamp:'',name:'',title:''},thanks:'TERIMA KASIH ATAS KEPERCAYAAN ANDA'}};
}

function invHTML(d){
  const c=d.color||'#0f6b7a',t=invCalc(d),L=v=>esc(v||''),pl='white-space:pre-line';
  const img=(u,s)=>safeUrl(u)?`<img src="${esc(u)}" crossorigin="anonymous" style="${s}" alt="">`:'';
  const th=(a,w)=>`<th style="padding:10px 12px;text-align:${a};width:${w};font-size:11px;letter-spacing:.06em">`;
  const tr=(l,v)=>`<div style="display:flex;justify-content:space-between;padding:6px 12px"><span>${l}</span><span>${v}</span></div>`;
  return `<div style="width:794px;min-height:1123px;background:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1e293b;display:flex;flex-direction:column;box-sizing:border-box">

async function invCanvas(d){
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0';host.innerHTML=invHTML(d);document.body.appendChild(host);
  try{await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
    return await html2canvas(host.firstElementChild,{scale:2,useCORS:true,backgroundColor:'#ffffff'})}finally{host.remove()}
}
async function invExport(d,kind){
  const cv=await invCanvas(d),name='Invoice-'+(d.no||'draft').replace(/[^\w-]/g,'_');
  if(kind==='jpg'){const a=document.createElement('a');a.download=name+'.jpg';a.href=cv.toDataURL('image/jpeg',.95);a.click();return}
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),w=210,ph=Math.floor(cv.width*297/210);
  for(let y=0,pg=0;y<cv.height;y+=ph,pg++){const s=document.createElement('canvas');s.width=cv.width;s.height=Math.min(ph,cv.height-y);
    s.getContext('2d').drawImage(cv,0,y,cv.width,s.height,0,0,cv.width,s.height);if(pg)pdf.addPage();pdf.addImage(s.toDataURL('image/jpeg',.95),'JPEG',0,0,w,s.height*w/cv.width)}
  pdf.save(name+'.pdf');
}
function invPrint(d){
  let r=$('#print-root');if(!r){r=document.createElement('div');r.id='print-root';document.body.appendChild(r)}
  r.innerHTML=invHTML(d);
  Promise.all([...r.querySelectorAll('img')].map(i=>i.complete?1:new Promise(z=>{i.onload=i.onerror=z}))).then(()=>window.print());
}
addEventListener('afterprint',()=>{const r=$('#print-root');if(r)r.innerHTML=''});
function fitInv(){const w=$('#invwrap'),p=$('#invprev');if(!w||!p)return;const s=Math.min(1,w.clientWidth/794);p.style.transform=`scale(${s})`;w.style.height=(p.offsetHeight*s)+'px'}

function bindInvoice(){
  const f=$('#invf'),d=invEdit.data;
  const set=(k,v)=>{const ks=k.split('.');let o=d;ks.slice(0,-1).forEach(x=>o=o[x]);o[ks[ks.length-1]]=v};
  const upd=()=>{$('#invprev').innerHTML=invHTML(d);fitInv()};
  f.addEventListener('input',e=>{const t=e.target;if(t.dataset.k){set(t.dataset.k,t.value);upd()}else if(t.dataset.i!==undefined){d.items[t.dataset.i][t.dataset.f]=t.value;upd()}});
  f.addEventListener('change',async e=>{const t=e.target,k=t.dataset.imgk;if(!k||!t.files[0])return;
    try{toast('Mengunggah gambar...');set(k,await upload(t.files[0],'invoice'));upd();toast('Gambar ditambahkan')}catch(er){toast(er.message,false)}});
  f.addEventListener('click',e=>{const t=e.target;
    if(t.dataset.imgclear){set(t.dataset.imgclear,'');const i=$(`[data-imgk="${t.dataset.imgclear}"]`);if(i)i.value='';upd()}
    if('add' in t.dataset){d.items.push({d:'',q:1,p:0});$('#invitems').innerHTML=itemsHTML(d.items);upd()}
    if(t.dataset.rm!==undefined&&d.items.length>1){d.items.splice(+t.dataset.rm,1);$('#invitems').innerHTML=itemsHTML(d.items);upd()}});
  upd();
  $('#invback').onclick=()=>{invEdit=null;viewDash()};
  $('#invsave').onclick=e=>withLoading(e.currentTarget,async()=>{
    const row={user_id:session.user.id,number:d.no,client_name:d.bill.name,total:invCalc(d).total,status:d.status,data:d,updated_at:new Date().toISOString()};
    if(invEdit.id){const {error}=await sb.from('invoices').update(row).eq('id',invEdit.id);if(error)throw error}
    else{const {data,error}=await sb.from('invoices').insert(row).select('id').single();if(error)throw error;invEdit.id=data.id}
    toast('Invoice disimpan')});
  $('#invpdf').onclick=e=>withLoading(e.currentTarget,()=>invExport(d,'pdf'));
  $('#invjpg').onclick=e=>withLoading(e.currentTarget,()=>invExport(d,'jpg'));
  $('#invprint').onclick=()=>invPrint(d);
}

/* ---- Checkout + metode pembayaran ---- */
function payOptions(pm={}){const o=[];
  if(pm.qris)o.push({k:'QRIS',type:'qris'});
  (pm.banks||[]).forEach(b=>o.push({k:'Transfer '+b.bank,type:'bank',...b}));
  (pm.ewallets||[]).forEach(w=>o.push({k:'E-Wallet '+w.name,type:'ew',...w}));
  if(pm.other)o.push({k:'Lainnya',type:'other',note:pm.other});return o}

function payInstruction(o,pm,total){
  const row=(l,v)=>`<div class="flex justify-between items-center gap-2 py-1.5 text-sm"><span class="text-slate-500">${l}</span><span class="font-semibold text-right">${esc(v)}</span></div>`;
  let h=`<div class="bg-indigo-50 rounded-xl p-3 text-center mb-3"><p class="text-xs text-slate-500">Total pembayaran</p><p class="text-2xl font-extrabold text-indigo-600">${rp(total)}</p></div>`;
  if(o.type==='qris')h+=`<img src="${esc(pm.qris)}" class="mx-auto max-h-72 rounded-xl border" alt="QRIS"><p class="text-xs text-center text-slate-400 mt-2">Scan dengan aplikasi bank atau e-wallet apa pun.</p>`;
  if(o.type==='bank')h+=row('Bank',o.bank)+row('No. Rekening',o.no)+row('Atas nama',o.name||'-')+`<button class="btn btn-ghost w-full mt-2" data-copy="${esc(o.no)}">Salin nomor rekening</button>`;
  if(o.type==='ew')h+=row('E-Wallet',o.name)+row('Nomor',o.no)+`<button class="btn btn-ghost w-full mt-2" data-copy="${esc(o.no)}">Salin nomor</button>`;
  if(o.type==='other')h+=`<p class="text-sm bg-slate-50 rounded-xl p-3">${esc(o.note)}</p>`;
  return h}

function checkout(prod,seller,ref){
  const opts=payOptions(seller.payment_methods||{});
  openModal(`<div class="flex justify-between items-center mb-1"><h3 class="font-extrabold text-lg">Checkout</h3><button id="cl" class="text-slate-400 text-2xl" aria-label="Tutup">&times;</button></div>
  <div class="bg-indigo-50 rounded-xl p-3 mb-4 flex justify-between text-sm"><span class="font-semibold">${esc(prod.title)}</span><span class="font-extrabold text-indigo-600">${rp(prod.price)}</span></div>
  <form id="co" class="space-y-3">
    <input class="inp" name="name" placeholder="Nama lengkap" required>
    <input class="inp" name="wa" placeholder="Nomor WhatsApp, mis. 0812xxxx" inputmode="tel" pattern="[0-9+\\s-]{8,16}" required>
    <input class="inp" type="email" name="email" placeholder="Email" required>
    <p class="text-sm font-semibold pt-1">Metode pembayaran</p>
    ${opts.length?opts.map((o,i)=>`<label class="flex items-center gap-3 border rounded-xl p-3 text-sm cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50"><input type="radio" name="pay" value="${i}" class="accent-indigo-600" ${i?'':'checked'}><span class="font-semibold">${esc(o.k)}</span></label>`).join(''):'<p class="text-sm text-slate-500 bg-slate-50 rounded-xl p-3">Penjual belum mengatur metode pembayaran. Pembayaran dikonfirmasi lewat WhatsApp.</p>'}
    <button class="btn w-full" type="submit">Konfirmasi pesanan</button></form>`);
  $('#cl').onclick=closeModal;
  $('#co').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    withLoading($('#co button[type=submit]'),async()=>{
      const o=opts.length?opts[Number(f.pay)]:{k:'Konfirmasi via WhatsApp',type:'other',note:'Pembayaran dikonfirmasi lewat WhatsApp.'};
      let code=null,commission=0;
      if(ref&&seller.affiliate_enabled){const {data:a}=await sb.from('affiliates').select('code').eq('code',ref).eq('seller_id',seller.id).maybeSingle();
        if(a&&prod.affiliate_enabled){code=a.code;commission=Math.round(Number(prod.price)*Number(prod.affiliate_rate??seller.affiliate_rate??0)/100)}}
      const {error}=await sb.from('orders').insert({id:crypto.randomUUID(),product_id:prod.id,buyer_name:f.name,buyer_email:f.email,buyer_whatsapp:waNum(f.wa),status:'Menunggu Pembayaran',payment_method:o.k,affiliate_code:code,commission});
      if(error)throw new Error('Pesanan gagal disimpan. Coba lagi sebentar lagi.');
      const msg=`Halo, saya ingin memesan ${prod.title} seharga ${rp(prod.price)}.\nMetode pembayaran: ${o.k}\n\nData saya:\nNama: ${f.name}\nWhatsApp: ${f.wa}\nEmail: ${f.email}\n\nSaya sudah/akan melakukan pembayaran. Terima kasih!`;
      const to=waNum(seller.whatsapp_number);
      modal.firstElementChild.innerHTML=`<div class="text-center mb-3"><p class="text-4xl">✅</p><h3 class="font-extrabold text-lg mt-1">Pesanan tersimpan</h3><p class="text-sm text-slate-500">Selesaikan pembayaran, lalu konfirmasi ke penjual.</p></div>
        ${payInstruction(o,seller.payment_methods||{},prod.price)}
        ${to?`<a class="btn w-full mt-4" href="https://wa.me/${to}?text=${encodeURIComponent(msg)}">Konfirmasi via WhatsApp</a>`:'<p class="text-xs text-red-500 mt-3">Penjual belum mengatur nomor WhatsApp.</p>'}
        <button id="cl2" class="btn btn-ghost w-full mt-2">Tutup</button>`;
      $('#cl2').onclick=closeModal;$$('[data-copy]',modal).forEach(b=>b.onclick=()=>copy(b.dataset.copy));
    })};
}
</script>
</body>
</html>
