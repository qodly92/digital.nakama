<body class="font-sans text-slate-800 antialiased">
<div id="app"></div>

<script>
/* ============ KONFIGURASI ============ */
const CFG=window.TOKO_CONFIG||{};
const _ok=v=>!!v&&!/XXXX|ISI_/i.test(v);
const SUPABASE_URL=_ok(CFG.SUPABASE_URL)?CFG.SUPABASE_URL:'https://obvrduoscrdklfofxgkk.supabase.co';
const MAIN_STORE=String(CFG.MAIN_STORE||'').toLowerCase(),ALLOW_REGISTER=CFG.ALLOW_REGISTER!==false;
const SUPABASE_ANON_KEY=_ok(CFG.SUPABASE_ANON_KEY)?CFG.SUPABASE_ANON_KEY:'sb_publishable_g6s3vnbsS3HD0TO8sOYXlA_qS_W6Vm-';
/* ====================================== */
const _bad=!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL.replace(/\/+$/,''))||/XXXX/i.test(SUPABASE_URL)||SUPABASE_ANON_KEY.startsWith('ISI_')||SUPABASE_ANON_KEY.length<30;
if(_bad){
  const why=!window.TOKO_CONFIG?'File <b>config.js</b> tidak ditemukan. Upload <b>config.js</b> ke folder yang sama dengan index.html (nama file harus persis config.js).':'File <b>config.js</b> terbaca, tetapi <b>SUPABASE_URL</b> atau <b>SUPABASE_ANON_KEY</b> belum diisi dengan nilai asli dari project Supabase Anda.';
  document.body.innerHTML='<div style="padding:2rem 1.25rem;font-family:system-ui,sans-serif;max-width:34rem;margin:auto;line-height:1.6"><h2>Konfigurasi belum diisi</h2><p>'+why+'</p><ol><li>Buka Supabase: Project Settings, lalu API.</li><li>Salin <b>Project URL</b> (contoh: https://abcdxyz.supabase.co) dan <b>anon public key</b> (diawali eyJ...).</li><li>Isi keduanya di <b>config.js</b>, simpan, lalu muat ulang halaman (Ctrl+F5).</li></ol></div>';
  throw new Error('Supabase belum dikonfigurasi');
}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app'),modal=$('#modal');
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const waNum=n=>{let d=String(n||'').replace(/\D/g,'');return d.startsWith('0')?'62'+d.slice(1):d};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const baseUrl=()=>location.origin+location.pathname;
const copy=t=>navigator.clipboard.writeText(t).then(()=>toast('Disalin'),()=>toast('Gagal menyalin',false));
let session=null,dashTab='home',invEdit=null,OID=null,ROLE=null;

function toast(m,ok=true){const t=$('#toast');t.textContent=m;t.className='fixed top-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-sm font-semibold text-white shadow-lg '+(ok?'bg-emerald-600':'bg-red-600');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),3800)}
async function withLoading(btn,fn){const o=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> Memproses...';try{await fn()}catch(e){console.error(e);toast(e.message||'Terjadi kesalahan. Coba lagi.',false)}finally{btn.disabled=false;btn.innerHTML=o}}
const loadingView=()=>app.innerHTML='<div class="min-h-screen grid place-items-center"><span class="spin dark" style="width:2rem;height:2rem"></span></div>';
const openModal=h=>{modal.innerHTML=`<div class="card w-full sm:max-w-md max-h-[92vh] overflow-y-auto p-5 rounded-b-none sm:rounded-b-[1.25rem]">${h}</div>`;modal.classList.remove('hidden');modal.classList.add('flex')};
const closeModal=()=>{modal.classList.add('hidden');modal.classList.remove('flex');modal.innerHTML=''};
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

/* ---- Upload gambar ke Supabase Storage ---- */
async function upload(file,folder){
  if(!file.type.startsWith('image/'))throw new Error('File harus berupa gambar.');
  if(file.size>3*1024*1024)throw new Error('Ukuran gambar maksimal 3 MB.');
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=`${session.user.id}/${folder}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from('media').upload(path,file,{contentType:file.type});
  if(error)throw new Error('Upload gagal: '+error.message+' (sudah menjalankan schema_v2.sql?)');
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
const picked=(form,name)=>form.elements[name]?.files?.[0];
const fileField=(name,label,url)=>`<div><p class="text-xs font-semibold text-slate-500 mb-1">${label}</p><div class="flex items-center gap-3"><img data-prev="${name}" src="${esc(url||'')}" class="w-14 h-14 rounded-xl object-cover bg-indigo-50 ${url?'':'invisible'}" alt=""><input type="file" name="${name}" accept="image/*" class="text-xs flex-1 min-w-0"></div></div>`;
document.addEventListener('change',e=>{const i=e.target;if(i.type==='file'&&i.files[0]){const im=$(`[data-prev="${i.name}"]`);if(im){im.src=URL.createObjectURL(i.files[0]);im.classList.remove('invisible')}}});

/* ============ ROUTER ============ */
function go(h){location.hash='#/'+h}
let _main=null;
async function mainStore(){if(MAIN_STORE)return MAIN_STORE;if(_main)return _main;const {data}=await sb.from('profiles').select('username').order('created_at',{ascending:true}).limit(1);_main=data&&data[0]?data[0].username:'';return _main}
async function route(){
  const h=location.hash.replace(/^#\/?/,''),[path,q]=h.split('?'),sp=new URLSearchParams(q||'');
  const {data}=await sb.auth.getSession();session=data.session;
  if(path.startsWith('p/'))return viewSales(null,decodeURIComponent(path.slice(2)),sp.get('ref'));
  if(path.startsWith('store/')){const pt=path.split('/');return pt[2]?viewSales(decodeURIComponent(pt[1]),decodeURIComponent(pt[2]),sp.get('ref')):viewStore(decodeURIComponent(pt[1]||''),sp.get('ref'),sp.get('p'))}
  if(path==='login')return session?go('dashboard'):viewAuth('login');
  if(path==='register'){if(session)return go('dashboard');if(!ALLOW_REGISTER&&await mainStore())return go('login');return viewAuth('register')}
  if(path==='staff')return session?go('dashboard'):viewStaffSignup(sp.get('code')||'');
  if(path==='dashboard')return session?viewDash():go('login');
  const un=await mainStore();if(!un)return viewAuth('register');
  return viewStore(un,sp.get('ref'),sp.get('p'));
}
addEventListener('hashchange',route);
sb.auth.onAuthStateChange((ev,s)=>{session=s;if(ev==='PASSWORD_RECOVERY')setTimeout(passwordModal,300)});
route();

/* ============ AUTH ============ */
function viewAuth(mode='login'){resetTheme();
  const reg=mode==='register';
  app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4" style="background:radial-gradient(900px 400px at 50% -10%,#e0e7ff,transparent)">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6"><div class="mx-auto w-12 h-12 rounded-2xl grid place-items-center text-white text-xl font-extrabold" style="background:linear-gradient(135deg,#6366f1,#7c3aed)">T</div>
    <h1 class="mt-4 text-2xl font-extrabold">${reg?'Buka toko Anda':'Masuk ke dashboard'}</h1>
    <p class="text-sm text-slate-500 mt-1">${reg?'Satu link untuk semua produk Anda.':'Kelola produk, pesanan, dan afiliasi.'}</p></div>
    <form id="af" class="card p-5 space-y-3">
      ${reg?`<input class="inp" name="store_name" placeholder="Nama toko" required>
      <input class="inp" name="username" placeholder="Username (huruf kecil, tanpa spasi)" pattern="[a-z0-9_]{3,20}" title="3-20 karakter: huruf kecil, angka, underscore" required>
      <input class="inp" name="wa" placeholder="Nomor WhatsApp, mis. 0812xxxx" inputmode="tel" required>`:''}
      <input class="inp" type="email" name="email" placeholder="Email" required>
      <input class="inp" type="password" name="password" placeholder="Password (min. 6 karakter)" minlength="6" required>
      <button class="btn w-full" type="submit">${reg?'Daftar':'Masuk'}</button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-4">${reg?'Sudah punya akun?':'Belum punya akun?'} <button id="sw" class="text-indigo-600 font-semibold">${reg?'Masuk':'Daftar'}</button></p>
  </div></div>`;
  $('#sw').onclick=()=>go(reg?'login':'register');if(!ALLOW_REGISTER&&!reg)$('#sw').parentElement.style.display='none';
  $('#sw').parentElement.insertAdjacentHTML('afterend','<a href="#/" class="block text-center text-xs text-slate-400 mt-6">← Kembali ke toko</a>');
  if(!reg){$('#af').insertAdjacentHTML('afterend','<p class="text-center mt-3"><button id="fp" class="text-xs text-slate-400 underline">Lupa password?</button></p>');$('#fp').onclick=forgotModal}
  $('#af').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    withLoading($('#af button[type=submit]'),async()=>{
      if(reg){
        const {data,error}=await sb.auth.signUp({email:f.email,password:f.password,options:{data:{username:f.username.toLowerCase(),store_name:f.store_name,whatsapp_number:waNum(f.wa)}}});
        if(error)throw new Error(error.message);
        if(!data.session){toast('Pendaftaran berhasil. Cek email untuk konfirmasi, lalu masuk.');return viewAuth('login')}
      }else{
        const {error}=await sb.auth.signInWithPassword({email:f.email,password:f.password});
        if(error){const m=error.message||'';
          if(/not confirmed/i.test(m))throw new Error('Email belum dikonfirmasi. Cek inbox/spam, atau matikan "Confirm email" di Supabase.');
          if(/invalid login/i.test(m))throw new Error('Email atau password salah (atau akun belum terdaftar).');
          if(/failed to fetch|network/i.test(m))throw new Error('Tidak bisa terhubung ke Supabase. Periksa SUPABASE_URL.');
          throw new Error(m)}
      }
      go('dashboard');
    })}
}

/* ============ DASHBOARD ============ */
const NAV=[['home','🏠','Beranda'],['products','📦','Produk'],['orders','🧾','Pesanan'],['affiliate','🤝','Afiliasi'],['invoice','📄','Invoice'],['staff','👥','Staf'],['settings','⚙️','Setelan']];
const stCls=s=>s==='Lunas'?'bg-emerald-50 text-emerald-700':s==='Dibatalkan'?'bg-slate-100 text-slate-500':'bg-amber-50 text-amber-700';

async function viewDash(){
  loadingView();
  const uid=session.user.id;
  const stf=await resolveRole();
  if(typeof stf==='string'){app.innerHTML=`<div class="min-h-screen grid place-items-center p-6 text-center"><div class="max-w-sm"><p class="text-4xl">🔒</p><p class="font-bold mt-2">${stf==='inactive'?'Akun staf Anda dinonaktifkan':'Kode undangan tidak valid, sudah dipakai, atau kedaluwarsa'}</p><p class="text-sm text-slate-500 mt-1">Hubungi pemilik toko.</p><button class="btn btn-danger mt-4" id="lo0">Keluar</button></div></div>`;$('#lo0').onclick=async()=>{await sb.auth.signOut();session=null;go('')};return}
  const oid=stf?stf.owner_id:uid;OID=oid;ROLE=stf;
  const can=k=>!stf||!!(stf.permissions||{})[k];
  {const ok={home:1,products:can('products'),orders:can('orders'),invoice:can('invoices'),affiliate:can('affiliate'),settings:!stf,staff:!stf};if(!ok[dashTab])dashTab='home'}
  const [p,pr,o,af,st,iv,ev,dr]=await Promise.all([
    sb.from('profiles').select('*').eq('id',oid).single(),
    sb.from('products').select('*').eq('user_id',oid).order('sort_order',{ascending:true,nullsFirst:false}).order('created_at',{ascending:false}),
    sb.from('orders').select('*, products(title, price)').order('created_at',{ascending:false}),
    sb.from('affiliates').select('id,code,created_at,profiles!affiliates_user_id_fkey(username,store_name)').eq('seller_id',oid),
    sb.rpc('affiliate_stats'),
    sb.from('invoices').select('*').order('created_at',{ascending:false}),
    sb.from('store_events').select('type,created_at').gte('created_at',new Date(Date.now()-30*864e5).toISOString()).order('created_at',{ascending:false}).limit(5000),
    sb.from('profiles').select('id,username,store_name,avatar_url,affiliate_rate,affiliate_note,products(id,title,category,price,affiliate_enabled,affiliate_rate)').eq('affiliate_enabled',true)
  ]);
  const err=p.error||pr.error||o.error||af.error||st.error||iv.error||ev.error||dr.error;
  if(err){app.innerHTML=`<div class="min-h-screen grid place-items-center p-6 text-center"><div class="max-w-sm"><p class="font-bold">Gagal memuat data</p><p class="text-sm text-slate-500 mt-1">${esc(err.message)}</p><p class="text-xs text-slate-400 mt-2">Pastikan semua file schema (schema.sql sampai schema_v5.sql) sudah dijalankan.</p><button class="btn mt-4" onclick="viewDash()">Coba lagi</button> <button class="btn btn-danger mt-4" id="lo0">Keluar</button></div></div>`;$('#lo0').onclick=async()=>{await sb.auth.signOut();go('')};return}
  const P=p.data,prods=pr.data,orders=o.data,mine=af.data,myAff=st.data||[];const invoices=iv.data,dir=dr.data||[];EV=ev.data||[];CUR_PRODS=prods;CUR_P=P;
  applyTheme(P.theme?.dash?.c1,P.theme?.dash?.c2);{const rs=document.documentElement.style;rs.removeProperty('--br');rs.removeProperty('--cr')}document.body.style.background='';setMeta('Dashboard - '+P.store_name,'','',P.favicon_url);
  const pm=P.payment_methods||{};let staffList=[],invites=[],staffErr=null;
  if(!stf){const [a,b]=await Promise.all([sb.from('staff').select('*').order('created_at'),sb.from('staff_invites').select('*').order('created_at',{ascending:false})]);staffErr=(a.error||b.error)?(a.error||b.error).message:null;staffList=a.data||[];invites=b.data||[]}
  const CTX={P,prods,orders,mine,myAff,invoices,dir,uid,pm,oid,stf,can,isStaff:!!stf,staffList,invites,staffErr};
  const paid=orders.filter(x=>x.status==='Lunas'),pending=orders.filter(x=>x.status==='Menunggu Pembayaran');
  const revenue=paid.filter(x=>!x.currency||x.currency==='IDR').reduce((s,x)=>s+Number(x.amount??x.products?.price??0)-Number(x.commission||0),0);
  const link=`${baseUrl()}#/store/${P.username}`;
  const avatar=P.avatar_url?`<img src="${esc(safeUrl(P.avatar_url))}" class="w-full h-full object-cover" alt="">`:esc((P.store_name||'T')[0]);

  /* grafik 7 hari */
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
  const cnt=days.map(d=>orders.filter(x=>new Date(x.created_at).toDateString()===d.toDateString()).length),mx=Math.max(1,...cnt);

  const orderRow=x=>`<div class="card p-4 mb-3"><div class="flex justify-between gap-2"><p class="font-semibold">${esc(x.products?.title||'-')}</p><span class="text-xs font-semibold px-2 py-1 rounded-full h-fit ${stCls(x.status)}">${esc(x.status)}</span></div>
    <p class="text-sm text-slate-600 mt-1">${esc(x.buyer_name)} · ${esc(x.buyer_whatsapp)}</p>
    <p class="text-xs text-slate-400">${esc(x.buyer_email)} · ${new Date(x.created_at).toLocaleString('id-ID')}</p>
    <p class="text-xs text-slate-500 mt-1">Pembayaran: <b>${esc(x.payment_method||'-')}</b>${x.affiliate_code?` · Afiliasi <b>${esc(x.affiliate_code)}</b> (komisi ${rp(x.commission)})`:''}</p>
    <div class="flex items-center justify-between gap-2 mt-3"><p class="font-bold text-indigo-600">${money(x.amount??x.products?.price,x.currency)}${x.quantity>1?` <span class="text-xs text-slate-400">(${x.quantity} item)</span>`:''}</p><div class="flex gap-1.5 flex-wrap justify-end">
      <a class="btn btn-ghost !py-1 !px-3 text-xs" target="_blank" rel="noopener" href="https://wa.me/${waNum(x.buyer_whatsapp)}">Chat</a>
      <button class="btn btn-ghost !py-1 !px-3 text-xs" data-oedit="${x.id}">Ubah</button><button class="btn btn-ghost !py-1 !px-3 text-xs" data-oinv="${x.id}">Invoice</button><button class="btn btn-danger !py-1 !px-3 text-xs" data-odel="${x.id}">Hapus</button>
      ${x.status!=='Lunas'?`<button class="btn !py-1 !px-3 text-xs" data-st="${x.id}|Lunas">Tandai lunas</button>`:''}
      ${x.status==='Menunggu Pembayaran'?`<button class="btn btn-danger !py-1 !px-3 text-xs" data-st="${x.id}|Dibatalkan">Batalkan</button>`:''}</div></div></div>`;

  let body='';

/* ===== v5: produk (urutan, harga, add-on) ===== */
let CUR_PRODS=[];
const money=(n,c)=>(!c||c==='IDR')?rp(n):new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(Number(n)||0);
const isFlash=x=>!!x.flash_sale&&x.sale_price!=null&&x.sale_price!==''&&(!x.sale_ends_at||new Date(x.sale_ends_at)>new Date());
const unitPrice=x=>isFlash(x)?Number(x.sale_price):Number(x.price);
const BTNS=['Beli Sekarang','Saya Mau Ini','Pesan Sekarang','Dapatkan Sekarang','Daftar Sekarang','Booking Sekarang','Donasi'];
const swRow=(n,l,sub,on,id)=>`<label class="flex items-center justify-between gap-3 py-1.5 cursor-pointer"><span><span class="text-sm font-semibold">${l}</span>${sub!==undefined?`<span class="block text-xs text-slate-400" ${id?`id="${id}"`:''}>${sub}</span>`:''}</span><input type="checkbox" class="sw" name="${n}" ${on?'checked':''}></label>`;
const toLocalDT=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,16)};
function priceTag(x){const c=x.currency||'IDR';
  return (isFlash(x)?`<span class="line-through text-slate-400 text-xs">${money(x.price,c)}</span> <b class="text-indigo-600">${money(x.sale_price,c)}</b> <span class="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full">⚡ Flash</span>`:`<b class="text-indigo-600">${money(x.price,c)}</b>`)
   +(x.pay_what_you_want?' <span class="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded-full">Bayar sesukamu</span>':'')}

function productsBody(C){
  const ps=C.prods;
  return `<div class="flex items-center justify-between mb-1"><h2 class="font-extrabold text-xl">Produk</h2><div class="flex gap-2 flex-wrap justify-end"><button id="bannerall" class="btn btn-ghost">Banner semua</button><button id="bulkp" class="btn btn-ghost">+ Banyak</button><button id="addp" class="btn">+ Tambah</button></div></div>
  <p class="text-xs text-slate-500 mb-3">Atur urutan tampil di toko: seret kartu (desktop) atau pakai panah ▲▼. Matikan saklar untuk menyembunyikan produk dari toko.</p>
  <div id="plist">${ps.length?ps.map(x=>`<div class="card p-3 mb-3 flex items-center gap-2 ${x.is_active===false?'bg-slate-50':''}" draggable="true" data-pid="${x.id}">
    <span class="cursor-grab text-slate-300 text-xl select-none px-1" title="Seret untuk mengurutkan">⠿</span>
    <img src="${esc(safeUrl(x.image_url)||autoBanner(x,C.P))}" draggable="false" onerror="this.style.visibility='hidden'" class="w-14 h-14 rounded-xl object-cover bg-indigo-50 shrink-0" alt="">
    <div class="flex-1 min-w-0"><p class="font-semibold truncate ${x.is_active===false?'opacity-50':''}">${esc(x.title)}</p><p class="text-xs text-slate-500">${esc(x.category)}${x.stock!=null?' · Stok '+x.stock:''}${x.is_active===false?' · Disembunyikan':''}</p><p class="text-sm mt-0.5">${priceTag(x)}</p></div>
    <div class="flex flex-col items-end gap-1.5">
      <div class="flex items-center gap-1"><button class="w-7 h-7 rounded-lg bg-slate-100 text-xs" data-up aria-label="Naikkan">▲</button><button class="w-7 h-7 rounded-lg bg-slate-100 text-xs" data-down aria-label="Turunkan">▼</button><input type="checkbox" class="sw ml-1" data-vis="${x.id}" ${x.is_active===false?'':'checked'} title="Tampilkan di toko"></div>
      <div class="flex gap-1.5"><button class="btn btn-ghost !py-1 !px-3 text-xs" data-banner="${x.id}">Banner</button><button class="btn btn-ghost !py-1 !px-3 text-xs" data-sales="${x.id}">Sales page</button><button class="btn btn-ghost !py-1 !px-3 text-xs" data-edit="${x.id}">Ubah</button><button class="btn btn-danger !py-1 !px-3 text-xs" data-del="${x.id}">Hapus</button></div></div></div>`).join(''):'<div class="card p-8 text-center text-slate-500 text-sm">Belum ada produk. Tambahkan produk pertama Anda.</div>'}</div>`;
}
function bindProducts(C){
  const box=$('#plist');if(!box)return;let drag=null;
  const save=async()=>{const ids=$$('[data-pid]',box).map(e=>e.dataset.pid);const {error}=await sb.rpc('reorder_products',{p_ids:ids});error?toast('Gagal menyimpan urutan: '+error.message,false):toast('Urutan disimpan')};
  box.addEventListener('dragstart',e=>{drag=e.target.closest&&e.target.closest('[data-pid]');if(drag){drag.style.opacity='.45';e.dataTransfer.effectAllowed='move'}});
  box.addEventListener('dragend',()=>{if(drag)drag.style.opacity='';drag=null});
  box.addEventListener('dragover',e=>{e.preventDefault();const t=e.target.closest('[data-pid]');if(!drag||!t||t===drag)return;const r=t.getBoundingClientRect();box.insertBefore(drag,e.clientY>r.top+r.height/2?t.nextSibling:t)});
  box.addEventListener('drop',e=>{e.preventDefault();save()});
  $$('[data-up]',box).forEach(b=>b.onclick=()=>{const el=b.closest('[data-pid]'),pv=el.previousElementSibling;if(pv){box.insertBefore(el,pv);save()}});
  $$('[data-down]',box).forEach(b=>b.onclick=()=>{const el=b.closest('[data-pid]'),nx=el.nextElementSibling;if(nx){box.insertBefore(nx,el);save()}});
  $$('[data-vis]',box).forEach(c=>c.onchange=async()=>{const {error}=await sb.from('products').update({is_active:c.checked}).eq('id',c.dataset.vis);
    if(error){c.checked=!c.checked;toast(error.message,false)}else{toast(c.checked?'Produk ditampilkan di toko':'Produk disembunyikan dari toko');const el=c.closest('[data-pid]');el.classList.toggle('bg-slate-50',!c.checked)}});
}

function productForm(x={}){
  const adds=(x.addons||[]).map(a=>({name:a.name,price:a.price}));
  const addRows=()=>adds.map((a,i)=>`<div class="flex gap-1.5 items-center"><input class="inp !px-2 flex-1 min-w-0" placeholder="Nama add-on" data-ai="${i}" data-af="name" value="${esc(a.name)}"><input class="inp !px-2 w-28" type="number" min="0" placeholder="Harga" data-ai="${i}" data-af="price" value="${a.price??''}"><button type="button" class="text-red-500 text-xl px-1" data-arm="${i}" aria-label="Hapus add-on">&times;</button></div>`).join('')||'<p class="text-xs text-slate-400">Belum ada add-on.</p>';
  const box='rounded-2xl border border-slate-200 p-4 space-y-2';
  openModal(`<div class="flex justify-between items-center mb-4"><h3 class="font-extrabold text-lg">${x.id?'Ubah produk':'Produk baru'}</h3><button id="cl" class="text-slate-400 text-2xl" aria-label="Tutup">&times;</button></div>
  <form id="prf" class="space-y-3">
    <input class="inp" name="title" placeholder="Nama produk" value="${esc(x.title)}" required>
    <select class="inp" name="category">${['Produk Digital','Jasa/Layanan','Produk Fisik'].map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select>
    <textarea class="inp" name="description" rows="3" placeholder="Deskripsi produk">${esc(x.description)}</textarea>
    ${fileField('image','Gambar produk',x.image_url)}
    <input class="inp" name="digital_file_url" placeholder="Tautan unduhan / catatan akses" value="${esc(x.digital_file_url)}">
    <div class="${box}"><p class="font-extrabold text-slate-500">Harga</p>
      ${swRow('pwyw','Izinkan pembeli membayar sesukanya','Harga di bawah menjadi nominal minimum',x.pay_what_you_want)}
      ${swRow('flash','Flash Sale','Buat harga diskon untuk waktu terbatas',x.flash_sale)}
      <div class="grid grid-cols-[1fr_110px] gap-2"><div>${FL('Harga')}<input class="inp" type="number" name="price" min="0" step="any" value="${x.price??0}" required></div>
        <div>${FL('Mata uang')}<select class="inp" name="currency">${['IDR','USD','SGD','MYR'].map(c=>`<option ${(x.currency||'IDR')===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
      <div id="fsbox" class="${x.flash_sale?'':'hidden'} grid grid-cols-2 gap-2"><div>${FL('Harga diskon (opsional)')}<input class="inp" type="number" name="sale" min="0" step="any" value="${x.sale_price??''}" placeholder="Sale Price"></div><div>${FL('Berakhir pada (opsional)')}<input class="inp" type="datetime-local" name="ends" value="${x.sale_ends_at?toLocalDT(x.sale_ends_at):''}"></div></div>
      ${swRow('limitstock','Jumlah item',x.stock!=null?'Terbatas':'Unlimited',x.stock!=null,'stsub')}
      <div id="stbox" class="${x.stock!=null?'':'hidden'}"><input class="inp" type="number" name="stock" min="0" value="${x.stock??10}" placeholder="Stok"></div>
      ${swRow('limitqty','Batasi qty per checkout',undefined,x.max_qty!=null)}
      <div id="qtbox" class="${x.max_qty!=null?'':'hidden'}"><input class="inp" type="number" name="maxqty" min="1" value="${x.max_qty??1}" placeholder="Maks. qty"></div>
      <div>${FL('Tombol pembelian')}<select class="inp" name="btnlabel">${BTNS.map(b=>`<option ${(x.button_label||'Beli Sekarang')===b?'selected':''}>${b}</option>`).join('')}</select></div>
    </div>
    <div class="${box}"><div class="flex items-center justify-between"><p class="font-extrabold text-slate-500">Add On</p><button type="button" class="text-sm font-semibold text-indigo-600" data-addnew>+ Tambah Baru</button></div><p class="text-xs text-slate-400">Pilihan tambahan berbayar yang bisa dicentang pembeli saat checkout.</p><div id="adds" class="space-y-2">${addRows()}</div></div>
    <div class="bg-indigo-50 rounded-2xl p-3 space-y-2">${swRow('aff','Ikut program afiliasi',undefined,x.affiliate_enabled)}
      <input class="inp" type="number" name="arate" min="1" max="90" placeholder="Komisi khusus produk (%) — kosongkan = standar toko" value="${x.affiliate_rate??''}"></div>
    <button class="btn w-full" type="submit">${x.id?'Simpan perubahan':'Tambah produk'}</button></form>`);
  $('#cl').onclick=closeModal;
  const f=$('#prf'),E=f.elements,show=(id,on)=>$('#'+id).classList.toggle('hidden',!on);
  E.flash.onchange=()=>show('fsbox',E.flash.checked);
  E.limitstock.onchange=()=>{show('stbox',E.limitstock.checked);$('#stsub').textContent=E.limitstock.checked?'Terbatas':'Unlimited'};
  E.limitqty.onchange=()=>show('qtbox',E.limitqty.checked);
  f.addEventListener('input',e=>{const t=e.target;if(t.dataset.ai!==undefined)adds[t.dataset.ai][t.dataset.af]=t.value});
  f.addEventListener('click',e=>{const t=e.target;
    if('addnew' in t.dataset){adds.push({name:'',price:''});$('#adds').innerHTML=addRows()}
    if(t.dataset.arm!==undefined){adds.splice(+t.dataset.arm,1);$('#adds').innerHTML=addRows()}});
  f.onsubmit=e=>{e.preventDefault();
    withLoading($('button[type=submit]',f),async()=>{
      const price=Number(E.price.value)||0,sale=E.flash.checked&&E.sale.value!==''?Number(E.sale.value):null;
      if(price<0)throw new Error('Harga tidak boleh negatif.');
      if(sale!=null&&sale>=price)throw new Error('Harga flash sale harus lebih kecil dari harga normal.');
      const image_url=picked(f,'image')?await upload(picked(f,'image'),'product'):(x.image_url||'');
      const row={title:E.title.value.trim(),category:E.category.value,price,currency:E.currency.value,description:E.description.value,image_url,digital_file_url:E.digital_file_url.value,
        pay_what_you_want:E.pwyw.checked,flash_sale:E.flash.checked,sale_price:sale,sale_ends_at:E.flash.checked&&E.ends.value?new Date(E.ends.value).toISOString():null,
        stock:E.limitstock.checked?Math.max(0,parseInt(E.stock.value)||0):null,max_qty:E.limitqty.checked?Math.max(1,parseInt(E.maxqty.value)||1):null,

        affiliate_enabled:E.aff.checked,affiliate_rate:E.arate.value===''?null:Number(E.arate.value)};

      if(error)throw error;closeModal();toast(x.id?'Produk diperbarui':'Produk ditambahkan');viewDash()})};
}

/* ===== v3: grafik, aksi pesanan, afiliasi, invoice ===== */
let EV=[],evRange=14;
async function track(sid,type,pid=null){try{
  if(type==='view'){const k='v_'+sid+(pid||'');if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}
  const {data}=await sb.auth.getSession();if(data.session?.user?.id===sid)return;
  await sb.from('store_events').insert({seller_id:sid,product_id:pid,type});
}catch(e){}}

function drawChart(){const box=$('#vc');if(!box)return;
  const days=[...Array(evRange)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(evRange-1)+i);return d});
  const n=(t,d)=>EV.filter(e=>e.type===t&&new Date(e.created_at).toDateString()===d.toDateString()).length;
  const v=days.map(d=>n('view',d)),c=days.map(d=>n('click',d)),mx=Math.max(1,...v,...c),sum=a=>a.reduce((s,x)=>s+x,0),step=Math.ceil(evRange/7);
  box.innerHTML=`<div class="card p-4 mt-3"><div class="flex items-center justify-between"><p class="font-bold text-sm">Total Views &amp; Clicks</p>
  <select id="evr" class="text-xs border border-slate-200 rounded-lg px-2 py-1.5 bg-white">${[7,14,30].map(r=>`<option value="${r}" ${r===evRange?'selected':''}>${r} hari</option>`).join('')}</select></div>

async function joinStore(u,uid){
  const {data:s}=await sb.from('profiles').select('id,affiliate_enabled').eq('username',u).maybeSingle();
  if(!s)throw new Error('Toko tidak ditemukan.');
  if(!s.affiliate_enabled)throw new Error('Toko ini belum membuka program afiliasi.');
  if(s.id===uid)throw new Error('Anda tidak bisa menjadi afiliasi toko sendiri.');
  const {error}=await sb.from('affiliates').insert({seller_id:s.id,user_id:uid,code:Math.random().toString(36).slice(2,8)});
  if(error)throw new Error(error.code==='23505'?'Anda sudah bergabung di toko ini.':error.message);
  toast('Berhasil bergabung. Salin link afiliasi Anda.');viewDash();
}

/* ---- Invoice ---- */
const fmtD=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}):'';
function invCalc(d){const sub=d.items.reduce((s,i)=>s+(+i.q||0)*(+i.p||0),0),disc=+d.discount||0,tax=Math.max(0,sub-disc)*(+d.tax||0)/100;return{sub,disc,tax,total:sub-disc+tax}}

function newInvoice(C,order){
  const P=C.P,pm=P.payment_methods||{},b=(pm.banks||[])[0]||{},today=new Date().toISOString().slice(0,10),due=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  return {id:null,data:{no:'INV-'+today.replace(/-/g,'')+'-'+String(C.invoices.length+1).padStart(3,'0'),date:today,due,status:'Belum Dibayar',color:'#6aa117',
    brand:{name:P.store_name||'',tag:'',logo:P.avatar_url||'',phone:P.whatsapp_number||'',email:'',web:`${baseUrl()}#/store/${P.username}`,addr:''},
    bill:{name:order?.buyer_name||'',company:'',phone:order?.buyer_whatsapp||'',addr:order?.buyer_email||''},
    items:order?[{d:order.products?.title||'',q:order.quantity||1,p:((order.amount??order.products?.price)||0)/(order.quantity||1)}]:[{d:'',q:1,p:0}],tax:0,discount:0,
    pay:{qris:pm.qris||'',info:b.bank?`Bank: ${b.bank}\nNo. Rekening: ${b.no}\nAtas nama: ${b.name||''}`:''},terms:'Pembayaran paling lambat pada tanggal jatuh tempo.',
    sign:{img:'',stamp:'',name:'',title:''},thanks:'TERIMA KASIH ATAS KEPERCAYAAN ANDA'}};
}

async function invCanvas(d){
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0';host.innerHTML=invHTML(d);document.body.appendChild(host);
  try{await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
    return await html2canvas(host.firstElementChild,{scale:2,useCORS:true,backgroundColor:'#ffffff'})}finally{host.remove()}
}
async function invExport(d,kind){
  const cv=await invCanvas(d),name='Invoice-'+(d.no||'draft').replace(/[^\w-]/g,'_');
  if(kind==='jpg'){const a=document.createElement('a');a.download=name+'.jpg';a.href=cv.toDataURL('image/jpeg',.95);a.click();return}
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),w=210,ph=Math.floor(cv.width*297/210);
  for(let y=0,pg=0;y<cv.height;y+=ph,pg++){const s=document.createElement('canvas');s.width=cv.width;s.height=Math.min(ph,cv.height-y);
    s.getContext('2d').drawImage(cv,0,y,cv.width,s.height,0,0,cv.width,s.height);if(pg)pdf.addPage();pdf.addImage(s.toDataURL('image/jpeg',.95),'JPEG',0,0,w,s.height*w/cv.width)}
  pdf.save(name+'.pdf');
}
function invPrint(d){
  let r=$('#print-root');if(!r){r=document.createElement('div');r.id='print-root';document.body.appendChild(r)}
  r.innerHTML=invHTML(d);
  Promise.all([...r.querySelectorAll('img')].map(i=>i.complete?1:new Promise(z=>{i.onload=i.onerror=z}))).then(()=>window.print());
}
addEventListener('afterprint',()=>{const r=$('#print-root');if(r)r.innerHTML=''});
function fitInv(){const w=$('#invwrap'),p=$('#invprev');if(!w||!p)return;const s=Math.min(1,w.clientWidth/794);p.style.transform=`scale(${s})`;w.style.height=(p.offsetHeight*s)+'px'}
addEventListener('resize',fitInv);

const FL=l=>`<p class="text-[11px] font-semibold text-slate-500 mb-1">${l}</p>`;
const FI=(k,l,v,t='text')=>`<div>${FL(l)}<input class="inp" type="${t}" data-k="${k}" value="${esc(v)}"></div>`;

function bindInvoice(){
  const f=$('#invf'),d=invEdit.data;
  const set=(k,v)=>{const ks=k.split('.');let o=d;ks.slice(0,-1).forEach(x=>o=o[x]);o[ks[ks.length-1]]=v};
  const upd=()=>{$('#invprev').innerHTML=invHTML(d);fitInv()};
  f.addEventListener('input',e=>{const t=e.target,rg=k=>f.querySelector(`[data-rgb="${k}"]`);
    if(t.dataset.rgb){d.color=RGBhex(rg('r').value,rg('g').value,rg('b').value);f.querySelector('[data-k="color"]').value=d.color;upd()}
    else if(t.dataset.k){set(t.dataset.k,t.value);if(t.dataset.k==='color'){const c=hexRGB(d.color);['r','g','b'].forEach((k,i)=>rg(k).value=c[i])}upd()}
    else if(t.dataset.i!==undefined){d.items[t.dataset.i][t.dataset.f]=t.value;upd()}});
  f.addEventListener('change',async e=>{const t=e.target,k=t.dataset.imgk;if(!k||!t.files[0])return;
    try{toast('Mengunggah gambar...');set(k,await upload(t.files[0],'invoice'));upd();toast('Gambar ditambahkan')}catch(er){toast(er.message,false)}});
  f.addEventListener('click',e=>{const t=e.target;
    if(t.dataset.imgclear){set(t.dataset.imgclear,'');const i=$(`[data-imgk="${t.dataset.imgclear}"]`);if(i)i.value='';upd()}
    if('defcolor' in t.dataset){d.color='#6aa117';f.querySelector('[data-k="color"]').value=d.color;['r','g','b'].forEach((k,i)=>f.querySelector(`[data-rgb="${k}"]`).value=[106,161,23][i]);upd()}
    if('add' in t.dataset){d.items.push({d:'',q:1,p:0});$('#invitems').innerHTML=itemsHTML(d.items);upd()}
    if(t.dataset.rm!==undefined&&d.items.length>1){d.items.splice(+t.dataset.rm,1);$('#invitems').innerHTML=itemsHTML(d.items);upd()}});
  upd();
  $('#invback').onclick=()=>{invEdit=null;viewDash()};
  $('#invsave').onclick=e=>withLoading(e.currentTarget,async()=>{
    const row={user_id:OID,number:d.no,client_name:d.bill.name,total:invCalc(d).total,status:d.status,data:d,updated_at:new Date().toISOString()};
    if(invEdit.id){const {error}=await sb.from('invoices').update(row).eq('id',invEdit.id);if(error)throw error}
    else{const {data,error}=await sb.from('invoices').insert(row).select('id').single();if(error)throw error;invEdit.id=data.id}
    toast('Invoice disimpan')});
  $('#invpdf').onclick=e=>withLoading(e.currentTarget,()=>invExport(d,'pdf'));
  $('#invjpg').onclick=e=>withLoading(e.currentTarget,()=>invExport(d,'jpg'));
  $('#invprint').onclick=()=>invPrint(d);
}

const hexRGB=h=>{h=String(h||'#6aa117').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)||0)};
const RGBhex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(+v||0))).toString(16).padStart(2,'0')).join('');
function colorBlock(hex){const [r,g,b]=hexRGB(hex);
  return `<div>${FL('Warna tema (custom)')}<div class="flex items-center gap-2"><input class="inp !p-1 h-11 w-16 shrink-0" type="color" data-k="color" value="${esc(hex)}"><div class="grid grid-cols-3 gap-1.5 flex-1">${[['r','R',r],['g','G',g],['b','B',b]].map(([k,l,v])=>`<input class="inp !px-2" type="number" min="0" max="255" data-rgb="${k}" placeholder="${l}" title="${l}" value="${v}">`).join('')}</div></div><button type="button" class="text-xs text-indigo-600 font-semibold mt-1" data-defcolor>Pakai warna default (R106 G161 B23)</button></div>`}

function navItems(){return NAV.filter(([k])=>{if(!ROLE)return true;const p=ROLE.permissions||{};return k==='home'||(k==='products'&&p.products)||(k==='orders'&&p.orders)||(k==='invoice'&&p.invoices)||(k==='affiliate'&&p.affiliate)})}
async function resolveRole(){
  const u=session.user;
  let {data:st}=await sb.from('staff').select('*').eq('user_id',u.id).maybeSingle();
  if(!st&&u.user_metadata?.invite_code){await sb.rpc('claim_staff');({data:st}=await sb.from('staff').select('*').eq('user_id',u.id).maybeSingle())}
  if(st)return st.active?st:'inactive';
  if(u.user_metadata?.is_staff)return 'invalid';
  return null;
}

function ogData(P){const S=(P.theme||{}).store||{};return {u:baseUrl(),img:safeUrl(P.thumbnail_url)||safeUrl(P.banner_url)||safeUrl(P.avatar_url)||'',t:P.store_name||'',d:(P.bio||S.hero_sub||'').slice(0,200)}}

  return ['<!--OG-START-->',m('name="description"',d),m('property="og:type"','website'),m('property="og:site_name"',t),m('property="og:title"',t),m('property="og:description"',d),m('property="og:image"',img),m('property="og:url"',u),m('name="twitter:card"','summary_large_image'),m('name="twitter:title"',t),m('name="twitter:description"',d),m('name="twitter:image"',img),'<!--OG-END-->'].join('\n')}

function bindOG(C){

  if(k==='blobs')return `<div style="position:absolute;top:120px;right:-90px;width:340px;height:340px;border-radius:50%;background:var(--g);opacity:.2;filter:blur(30px)"></div><div style="position:absolute;bottom:-100px;left:-80px;width:380px;height:380px;border-radius:50%;background:linear-gradient(135deg,var(--c2),var(--c1));opacity:.18;filter:blur(30px)"></div><div style="position:absolute;top:55%;left:8%;width:90px;height:90px;border-radius:30%;border:3px solid var(--c1);opacity:.15;transform:rotate(20deg)"></div>`;
  if(k==='waves')return `<svg style="position:absolute;bottom:0;left:0;width:100%;height:260px" viewBox="0 0 800 260" preserveAspectRatio="none"><path d="M0 120 C150 60 300 200 450 130 S700 60 800 120 V260 H0Z" style="fill:var(--c1);opacity:.12"/><path d="M0 170 C160 110 320 230 480 170 S720 120 800 170 V260 H0Z" style="fill:var(--c2);opacity:.14"/></svg>`;
  return '';
}

function bindSettings(C){
  const f=$('#pf');if(!f)return;const {P,pm,uid}=C,E=f.elements;bindOG(C);
  $$('[data-pal]',f).forEach(b=>b.onclick=()=>{const w=b.dataset.pal;E[w+'1'].value=b.dataset.c1;E[w+'2'].value=b.dataset.c2;if(w==='d')applyTheme(b.dataset.c1,b.dataset.c2)});
  E.d1.oninput=E.d2.oninput=()=>applyTheme(E.d1.value,E.d2.value);
  E.username.oninput=()=>{$('#slugprev').textContent=baseUrl()+'#/store/'+E.username.value.trim().toLowerCase()};
  f.onsubmit=e=>{e.preventDefault();withLoading($('button[type=submit]',f),async()=>{
    const un=E.username.value.trim().toLowerCase();
    if(!/^[a-z0-9_-]{3,30}$/.test(un))throw new Error('Link toko: 3-30 karakter, hanya huruf kecil, angka, - dan _.');
    const lines=t=>t.value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a[0]&&a[1]);
    const up=async(n,fo)=>picked(f,n)?await upload(picked(f,n),fo):E[n+'_url'].value.trim();
    const [avatar_url,banner_url,favicon_url,thumbnail_url,qris]=await Promise.all([up('avatar','avatar'),up('banner','banner'),up('favicon','favicon'),up('thumb','thumb'),picked(f,'qris')?upload(picked(f,'qris'),'qris'):Promise.resolve(pm.qris||'')]);
    const payment_methods={qris:qris||'',banks:lines(E.banks).map(a=>({bank:a[0],no:a[1],name:a[2]||''})),ewallets:lines(E.ews).map(a=>({name:a[0],no:a[1]})),other:E.other.value.trim()};
    const theme={dash:{c1:E.d1.value,c2:E.d2.value},store:{c1:E.s1.value,c2:E.s2.value,decor:E.decor.value,card:E.cardstyle.value,btn:E.btnshape.value,layout:E.layout.value,hero_title:E.hero_title.value.trim(),hero_sub:E.hero_sub.value.trim(),cta:E.cta.value.trim()}};
    const {error}=await sb.from('profiles').update({username:un,store_name:E.store_name.value.trim(),bio:E.bio.value,whatsapp_number:waNum(E.wa.value),avatar_url,banner_url,favicon_url,thumbnail_url,payment_methods,theme}).eq('id',uid);
    if(error)throw new Error(error.code==='23505'?'Link toko sudah dipakai, pilih yang lain.':error.message);
    toast('Pengaturan disimpan');viewDash()})};
}

/* ---- Checkout + metode pembayaran ---- */
function payOptions(pm={}){const o=[];
  if(pm.qris)o.push({k:'QRIS',type:'qris'});
  (pm.banks||[]).forEach(b=>o.push({k:'Transfer '+b.bank,type:'bank',...b}));
  (pm.ewallets||[]).forEach(w=>o.push({k:'E-Wallet '+w.name,type:'ew',...w}));
  if(pm.other)o.push({k:'Lainnya',type:'other',note:pm.other});return o}

function payInstruction(o,pm,total){
  const row=(l,v)=>`<div class="flex justify-between items-center gap-2 py-1.5 text-sm"><span class="text-slate-500">${l}</span><span class="font-semibold text-right">${esc(v)}</span></div>`;
  let h=`<div class="bg-indigo-50 rounded-xl p-3 text-center mb-3"><p class="text-xs text-slate-500">Total pembayaran</p><p class="text-2xl font-extrabold text-indigo-600">${total}</p></div>`;
  if(o.type==='qris')h+=`<img src="${esc(pm.qris)}" class="mx-auto max-h-72 rounded-xl border" alt="QRIS"><p class="text-xs text-center text-slate-400 mt-2">Scan dengan aplikasi bank atau e-wallet apa pun.</p>`;
  if(o.type==='bank')h+=row('Bank',o.bank)+row('No. Rekening',o.no)+row('Atas nama',o.name||'-')+`<button class="btn btn-ghost w-full mt-2" data-copy="${esc(o.no)}">Salin nomor rekening</button>`;
  if(o.type==='ew')h+=row('E-Wallet',o.name)+row('Nomor',o.no)+`<button class="btn btn-ghost w-full mt-2" data-copy="${esc(o.no)}">Salin nomor</button>`;
  if(o.type==='other')h+=`<p class="text-sm bg-slate-50 rounded-xl p-3">${esc(o.note)}</p>`;
  return h}

function checkout(prod,seller,ref,remaining){
  const opts=payOptions(seller.payment_methods||{}),cur=prod.currency||'IDR',unit=unitPrice(prod),addons=prod.addons||[];
  const maxQ=Math.max(1,Math.min(prod.max_qty||(prod.stock!=null?99:1),remaining==null?99:remaining));
  openModal(`<div class="flex justify-between items-center mb-1"><h3 class="font-extrabold text-lg">Checkout</h3><button id="cl" class="text-slate-400 text-2xl" aria-label="Tutup">&times;</button></div>
  <div class="bg-indigo-50 rounded-xl p-3 mb-4 flex justify-between gap-2 text-sm"><span class="font-semibold">${esc(prod.title)}</span><span class="font-extrabold text-indigo-600 shrink-0">${money(unit,cur)}</span></div>
  <form id="co" class="space-y-3">
    <input class="inp" name="name" placeholder="Nama lengkap" required>
    <input class="inp" name="wa" placeholder="Nomor WhatsApp, mis. 0812xxxx" inputmode="tel" pattern="[0-9+\\s-]{8,16}" required>
    <input class="inp" type="email" name="email" placeholder="Email" required>
    ${prod.pay_what_you_want?`<div>${FL('Nominal pembayaran Anda (minimal '+money(unit,cur)+')')}<input class="inp" type="number" name="amt" min="${unit}" step="any" value="${unit}" required></div>`:''}
    ${maxQ>1?`<div>${FL('Jumlah (maks. '+maxQ+')')}<input class="inp" type="number" name="qty" min="1" max="${maxQ}" value="1" required></div>`:''}
    ${addons.length?`<p class="text-sm font-semibold pt-1">Tambahan (opsional)</p>`+addons.map((a,i)=>`<label class="flex items-center gap-3 border rounded-xl p-3 text-sm cursor-pointer"><input type="checkbox" name="ad" value="${i}" class="accent-indigo-600"><span class="flex-1">${esc(a.name)}</span><span class="font-semibold">+ ${money(a.price,cur)}</span></label>`).join(''):''}
    <div class="flex justify-between items-center bg-slate-50 rounded-xl p-3"><span class="text-sm text-slate-500">Total</span><span id="tot" class="text-xl font-extrabold text-indigo-600"></span></div>
    <p class="text-sm font-semibold pt-1">Metode pembayaran</p>
    ${opts.length?opts.map((o,i)=>`<label class="flex items-center gap-3 border rounded-xl p-3 text-sm cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50"><input type="radio" name="pay" value="${i}" class="accent-indigo-600" ${i?'':'checked'}><span class="font-semibold">${esc(o.k)}</span></label>`).join(''):'<p class="text-sm text-slate-500 bg-slate-50 rounded-xl p-3">Penjual belum mengatur metode pembayaran. Pembayaran dikonfirmasi lewat WhatsApp.</p>'}
    <button class="btn w-full" type="submit">Konfirmasi pesanan</button></form>`);
  $('#cl').onclick=closeModal;
  const f=$('#co'),E=f.elements;
  const calc=()=>{const q=Math.min(maxQ,Math.max(1,parseInt(E.qty&&E.qty.value)||1)),b=prod.pay_what_you_want?Math.max(unit,Number(E.amt.value)||unit):unit,ad=[...f.querySelectorAll('[name=ad]:checked')].map(c=>+c.value);
    return {q,ad,total:b*q+ad.reduce((s,i)=>s+Number(addons[i].price||0),0)}};
  const upd=()=>{$('#tot').textContent=money(calc().total,cur)};upd();f.addEventListener('input',upd);
  f.onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(f)),c=calc();
    withLoading($('#co button[type=submit]'),async()=>{
      const o=opts.length?opts[Number(fd.pay)]:{k:'Konfirmasi via WhatsApp',type:'other',note:'Pembayaran dikonfirmasi lewat WhatsApp.'};
      const {data,error}=await sb.rpc('place_order',{p_product:prod.id,p_name:fd.name,p_email:fd.email,p_wa:waNum(fd.wa),p_method:o.k,p_amount:prod.pay_what_you_want?Number(E.amt.value):null,p_qty:c.q,p_addons:c.ad,p_ref:ref||null});
      if(error)throw new Error(/could not find|does not exist/i.test(error.message)?'Fitur checkout belum aktif. Pemilik toko perlu menjalankan schema_v5.sql.':error.message);
      const total=data.amount,tstr=money(total,cur);
      const msg=`Halo, saya ingin memesan ${prod.title}${c.q>1?' x'+c.q:''}${c.ad.length?' + '+c.ad.map(i=>addons[i].name).join(', '):''}.\nTotal: ${tstr}\nMetode pembayaran: ${o.k}\n\nData saya:\nNama: ${fd.name}\nWhatsApp: ${fd.wa}\nEmail: ${fd.email}\n\nSaya sudah/akan melakukan pembayaran. Terima kasih!`;
      const to=waNum(seller.whatsapp_number);
      modal.firstElementChild.innerHTML=`<div class="text-center mb-3"><p class="text-4xl">✅</p><h3 class="font-extrabold text-lg mt-1">Pesanan tersimpan</h3><p class="text-sm text-slate-500">Selesaikan pembayaran, lalu konfirmasi ke penjual.</p></div>
        ${payInstruction(o,seller.payment_methods||{},tstr)}
        ${to?`<a class="btn w-full mt-4" href="https://wa.me/${to}?text=${encodeURIComponent(msg)}">Konfirmasi via WhatsApp</a>`:'<p class="text-xs text-red-500 mt-3">Penjual belum mengatur nomor WhatsApp.</p>'}
        <button id="cl2" class="btn btn-ghost w-full mt-2">Tutup</button>`;
      $('#cl2').onclick=closeModal;$$('[data-copy]',modal).forEach(b=>b.onclick=()=>copy(b.dataset.copy));
    })};
}
</script>
</body>
</html>
